# AI Order Management Agent - local stack.   Start:  docker compose up --build
#
#   db ──▶ migrate (alembic + seed) ──▶ api :8000 ──▶ orders-mcp :8001
#                                                └──▶ logistics-mcp :8002 (external MCP server)
#   mock-partners :9000 (payment OAuth2 / CRM / shipping) is called by api and orders-mcp
x-app: &app
  build: .
  image: order-agent:latest
  environment: &env
    DATABASE_URL: postgresql+asyncpg://orders:orders@db:5432/orders
    REPORTING_DATABASE_URL: postgresql+asyncpg://reporting:reporting@db:5432/orders
    JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-dev-only-change-me}
    LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
    LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
    LLM_API_KEY: ${LLM_API_KEY:-${GROQ_API_KEY:-}}
    MCP_SERVER_URL: http://orders-mcp:8001/mcp
    EXTERNAL_MCP_URL: http://logistics-mcp:8002/mcp
    EXTERNAL_MCP_API_KEY: ${EXTERNAL_MCP_API_KEY:-logistics-dev-key}
    PAYMENT_BASE_URL: http://mock-partners:9000/payment
    CRM_BASE_URL: http://mock-partners:9000/crm
    SHIPPING_BASE_URL: http://mock-partners:9000/shipping
    CORS_ORIGINS: '["http://localhost:3000"]'
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:   # others wait for this, not just for "container started"
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports: ["5432:5432"]

  migrate:   # one-shot job: schema + demo data, then exits 0
    <<: *app
    restart: "no"
    command: sh -c "alembic upgrade head && python -m app.seed"
    depends_on:
      db: {condition: service_healthy}

  mock-partners:
    <<: *app
    command: uvicorn mock_services.app:app --host 0.0.0.0 --port 9000
    ports: ["9000:9000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:9000/health')"]
      interval: 5s
      retries: 10

  logistics-mcp:   # a 3rd-party style MCP server with its own API key
    <<: *app
    command: python -m external_mcp.logistics_server --port 8002
    ports: ["8002:8002"]

  orders-mcp:      # OUR FastMCP server (Streamable HTTP, JWT auth)
    <<: *app
    command: python -m app.mcp_server.server --transport http --port 8001
    ports: ["8001:8001"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      mock-partners: {condition: service_healthy}

  api:
    <<: *app
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      retries: 10
    depends_on:
      migrate: {condition: service_completed_successfully}
      mock-partners: {condition: service_healthy}
      orders-mcp: {condition: service_started}
      logistics-mcp: {condition: service_started}

volumes:
  pgdata:
